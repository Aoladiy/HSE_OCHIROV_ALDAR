services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: oildb
      POSTGRES_USER: oiluser
      POSTGRES_PASSWORD: oilpass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - pipeline-net

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - pipeline-net

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 5;
        mc alias set local http://minio:9000 minioadmin minioadmin123;
        mc mb --ignore-existing local/oil-pipeline;
        echo 'Bucket oil-pipeline created';
      "
    networks:
      - pipeline-net

  jupyter:
    image: jupyter/scipy-notebook:latest
    container_name: jupyter
    restart: always
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      JUPYTER_TOKEN: "oiltoken"
    ports:
      - "8888:8888"
    volumes:
      - jupyter_data:/home/jovyan/work
      - ./notebooks:/home/jovyan/work/notebooks
    networks:
      - pipeline-net

  superset:
    build:
      context: ./superset
      dockerfile: Dockerfile
    container_name: superset
    restart: always
    environment:
      SUPERSET_SECRET_KEY: "supersecretkey123"
    ports:
      - "8088:8088"
    volumes:
      - superset_data:/app/superset_home
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py
    depends_on:
      - postgres
    command: >
      /bin/sh -c "
        superset db upgrade &&
        superset fab create-admin --username admin --firstname Admin --lastname User --email admin@oil.com --password admin123 || true &&
        superset init &&
        superset run -h 0.0.0.0 -p 8088
      "
    networks:
      - pipeline-net

networks:
  pipeline-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  jupyter_data:
  superset_data:
services:

  configsvr:
    image: mongo:7.0
    container_name: configsvr
    command: mongod --configsvr --replSet configRS --port 27019 --bind_ip_all
    volumes:
      - configsvr_data:/data/db
    networks:
      - mongo_cluster
    healthcheck:
      test: mongosh --port 27019 --eval "db.adminCommand('ping')" --quiet
      interval: 5s
      timeout: 5s
      retries: 10

  shard1:
    image: mongo:7.0
    container_name: shard1
    command: mongod --shardsvr --replSet shard1RS --port 27018 --bind_ip_all
    volumes:
      - shard1_data:/data/db
    networks:
      - mongo_cluster
    healthcheck:
      test: mongosh --port 27018 --eval "db.adminCommand('ping')" --quiet
      interval: 5s
      timeout: 5s
      retries: 10

  shard2:
    image: mongo:7.0
    container_name: shard2
    command: mongod --shardsvr --replSet shard2RS --port 27017 --bind_ip_all
    volumes:
      - shard2_data:/data/db
    networks:
      - mongo_cluster
    healthcheck:
      test: mongosh --port 27017 --eval "db.adminCommand('ping')" --quiet
      interval: 5s
      timeout: 5s
      retries: 10

  rs-init:
    image: mongo:7.0
    container_name: rs_init
    depends_on:
      configsvr:
        condition: service_healthy
      shard1:
        condition: service_healthy
      shard2:
        condition: service_healthy
    volumes:
      - ./init:/init
    networks:
      - mongo_cluster
    restart: "no"
    entrypoint: >
      bash -c "
        mongosh --host configsvr --port 27019 /init/init-configserver.js &&
        mongosh --host shard1 --port 27018 /init/init-shard1.js &&
        mongosh --host shard2 --port 27017 /init/init-shard2.js
      "

  mongos:
    image: mongo:7.0
    container_name: mongos
    command: mongos --configdb configRS/configsvr:27019 --port 27020 --bind_ip_all
    ports:
      - "27020:27020"
    depends_on:
      rs-init:
        condition: service_completed_successfully
    networks:
      - mongo_cluster
    healthcheck:
      test: mongosh --port 27020 --eval "db.adminCommand('ping')" --quiet
      interval: 5s
      timeout: 5s
      retries: 15

  init:
    image: mongo:7.0
    container_name: mongo_init
    depends_on:
      mongos:
        condition: service_healthy
    volumes:
      - ./init:/init
    networks:
      - mongo_cluster
    restart: "no"
    entrypoint: >
      bash -c "
        sleep 5 &&
        mongosh --host mongos --port 27020 /init/init-mongos.js
      "

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: university_app
    depends_on:
      mongos:
        condition: service_healthy
    environment:
      - MONGOS_URI=mongodb://mongos:27020/
      - PYTHONIOENCODING=utf-8
      - PYTHONUNBUFFERED=1
    networks:
      - mongo_cluster
    volumes:
      - ./report:/app/report
    stdin_open: true
    tty: true

volumes:
  configsvr_data:
  shard1_data:
  shard2_data:

networks:
  mongo_cluster:
    driver: bridge
